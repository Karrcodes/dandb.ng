    <!-- Stylesheets -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="media/Logos/logo.png">
    <!-- Cache bust: 2026-01-03-12:58 -->

    <!-- Load More Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            const logos = document.querySelectorAll('.trusted-logo');
            let isExpanded = false;

            loadMoreBtn.addEventListener('click', () => {
                isExpanded = !isExpanded;

                logos.forEach((logo, index) => {
                    if (index >= 4) {
                        logo.style.display = isExpanded ? 'block' : 'none';
                    }
                });

                loadMoreBtn.textContent = isExpanded ? 'Show Less' : 'Load More';
            });
        });
    </script>
