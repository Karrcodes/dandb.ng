<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="D&B Architecture - Award-winning architectural design and construction services">
    <title>D&B Architecture | Award-Winning Design & Construction</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/mobile.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="media/Logos/logo.png">
</head>

<body>
    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="mobile-header-container">
            <a href="#home" class="mobile-logo">
                <img src="media/Logos/logo.png" alt="D&B Architecture Logo">
            </a>

            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Mobile Navigation -->
        <nav class="mobile-nav">
            <ul class="mobile-nav-list">
                <li><a href="#home">Home</a></li>
                <li><a href="#works">Works</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Mobile Hero Section -->
        <section id="home" class="mobile-hero">
            <div class="mobile-hero-video">
                <video autoplay muted loop playsinline poster="media/video/hero_poster.jpg">
                    <source src="media/video/hero_video.mp4" type="video/mp4">
                </video>
            </div>
            <div class="mobile-hero-content">
                <h1 class="mobile-hero-title">D&B<br>ARCHITECTURE</h1>
                <p class="mobile-hero-subtitle">Award-Winning Design<br>& Construction</p>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="js/mobile-menu.js"></script>

</html>
